description: >-
  Fashion Diffusion sells one self-serve subscription ladder that covers the whole
  product, app and API alike. There is no separate API price list: every published
  tier states "Developer API access" as an included feature, and API consumption is
  metered in the same monthly image credits the app spends. Enterprise API volume is
  routed to a contact-sales conversation rather than a published tier.
