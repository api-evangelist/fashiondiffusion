billing_notes:
  - Each accepted API task creates a charge; there is no idempotency protection, so a
    duplicated submission is a duplicated charge.
  - Terms of Service 4.5 assigns refunds for in-app subscription purchases to Apple
    under Apple Media Services Terms.
