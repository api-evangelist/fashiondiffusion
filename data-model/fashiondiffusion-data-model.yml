operations:
  - operationId: submitVirtualTryOnTask
    method: POST
    path: /virtual-try-on/tasks
    returns: 202 + task id
    request_fields:
      - garmentImageUrl | garmentImageBase64
      - modelImageUrl | modelImageBase64
      - imageCount (1, 2, 4; default 1)
      - resolution (2K, 4K; default 2K)
      - ratio (auto, 1:1, 3:4, 4:3, 9:16, 16:9; default auto)
      - mode (FAST, REFINE; default FAST)
      - model (standard, pro; default standard)
      - prompt
  - operationId: submitAiInpaintingTask
    method: POST
    path: /ai-inpainting/tasks
    returns: 202 + task object (same shape as Virtual Try-On)
    request_fields:
      - originalImageUrl | imageBase64
      - prompt
      - model (standard, pro; default standard)
      - resolution (2K, 4K; default 2K)
      - ratio (auto, 1:1, 3:4, 4:3, 9:16, 16:9; default auto)
      - referenceImages (optional)
      - mask image (optional; without one the provider selects the editable area)
  - operationId: getTask
    method: GET
    path: /tasks/{taskId}
  - operationId: listTasks
    method: GET
    path: /tasks
    query_params: [limit, cursor, createdAfter]
