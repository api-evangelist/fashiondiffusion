name: Fashion Diffusion Public API — Lifecycle
description: >-
  Fashion Diffusion runs a v1 Public API with no published lifecycle apparatus around
  it: no version history, no deprecation or sunset policy, no changelog, no status
  page and no SLA. The only lifecycle statement in the documentation is an admission
  about the current version's limitations rather than a commitment about its future.
