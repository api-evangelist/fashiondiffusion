host_gap:
  note: >-
    The API landing page's JavaScript sample calls
    https://api.fashiondiffusion.ai/v1/virtual-try-on, but api.fashiondiffusion.ai does
    not resolve in DNS. The authoritative base documented in the reference is
    https://www.fashiondiffusion.ai/api/public/v1/, which is the one that answers.
    A developer copying the marketing snippet gets a DNS failure.
  evidence:
    - url: https://api.fashiondiffusion.ai/v1/virtual-try-on
      status: '<no response> (NXDOMAIN)'
    - url: https://www.fashiondiffusion.ai/api/public/v1/virtual-try-on/tasks
