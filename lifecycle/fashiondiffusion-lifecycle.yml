surface_gap:
  note: >-
    The API landing page markets "more than 18 purpose-built fashion AI endpoints",
    but the public reference documents only four operations across two capabilities
    (Virtual Try-On and AI Inpainting) plus task query and list. The remaining
    advertised endpoints have no public contract, reference or example.
  marketed_endpoints: '18+'
  documented_operations: 4
  evidence:
    - url: https://www.fashiondiffusion.ai/api-access
      status: 200
    - url: https://www.fashiondiffusion.ai/playground/api/docs
